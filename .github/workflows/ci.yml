name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --group dev --python 3.11
      - run: uv run ruff check src tests app.py notebooks scripts
      - run: uv run ruff format --check src tests app.py notebooks scripts
      - run: uv run pytest -q
      - run: uv build
      - run: uv run policypilot demo
